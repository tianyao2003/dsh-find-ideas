# What this workflow is for
# -------------------------
# Publishes the package to npm when a `v*` tag is pushed. There is no npm token
# anywhere: the job authenticates with GitHub's OIDC identity, which npm exchanges
# for a short-lived credential scoped to this repository and this filename. That
# is why `id-token: write` is the load-bearing line — without it the exchange has
# nothing to present.
#
# Trusted publishing needs npm >= 11.5.1 and node >= 22.14, and the publisher
# configured on npmjs.com must allow direct `npm publish` (the default for new
# publishers is staged publishing only). See the README's release notes.
#
# `check` and `test` run here as well as in ci.yml on purpose: a tag can point at
# a commit that never went through CI, and publishing is irreversible.

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: publish (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      # A tag that disagrees with package.json would publish the wrong version
      # under the right name, which is worse than failing here.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
      - run: npm publish
