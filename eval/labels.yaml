# dsh-find-ideas — 检索金集（人工标注唯一真源）
#
# 这个文件只记两样东西：「人的判断」和「可机械推导的事实」。
# 不记录任何插件输出——一旦记进来，金集就被实现污染了。
#
# 规则、禁止事项、定稿流程见同目录 README.md。
#
# 状态机：draft（idea 定稿，标注未开始）
#      → labeling（有标注，未满 3 个 yes）
#      → frozen（每个 idea 已定稿，含 sparse 标记）
#
# 分发警告：README.md 和本文件都含 seeds / expected，等于答案。
# 给第二标注者只能发 README.md 的「第 8 节 第二标注者须知」，
# 不要给整份文档，不要给本文件的 ideas[].seeds 与 ideas[].expected。

schema_version: 1
rubric_version: 1

meta:
  created: "2026-10-19"
  updated: "2026-10-19"
  status: frozen
  idea_count: 12
  labeler_a: "A（本人，唯一权威口径）"
  labeler_b: "AI 盲复核（只用于标 disputed，不进 expected）"
  plugin_version_at_label: "0.3.0" # 标注与插件版本解耦，但要记录
  hidden_during_label: [stars, score, rank, plugin_output]
  notes: |
    idea 文本已定稿，不再改。改 idea 等于换金集：必须 bump schema_version
    并重标全部条目，否则前后数据不可合并。

